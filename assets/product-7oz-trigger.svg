    <filter id="glow7"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow7"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/></filter>
    <filter id="bk7"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="lc7"><rect x="100" y="42" width="72" height="148" rx="2"/></clipPath>
  </defs>
  <rect width="280" height="240" fill="url(#bg7)" rx="12"/>
  <rect width="280" height="240" fill="url(#atmos7)" rx="12"/>
  <circle cx="42" cy="48" r="14" fill="#1a6fc4" opacity="0.06" filter="url(#bk7)"/>
  <circle cx="242" cy="38" r="16" fill="#e52535" opacity="0.04" filter="url(#bk7)"/>
  <circle cx="35" cy="185" r="10" fill="#e52535" opacity="0.05" filter="url(#bk7)"/>
