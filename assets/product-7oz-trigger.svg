      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
    <radialGradient id="atmos7" cx="0.5" cy="0.6" r="0.65">
      <stop offset="0%" stop-color="#1a6fc4" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#e52535" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="canBody7" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2d35"/>
      <stop offset="12%" stop-color="#3d4150"/>
      <stop offset="38%" stop-color="#52576a"/>
      <stop offset="52%" stop-color="#6b7089"/>
