      <text x="136" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="4" fill="#e52535">+</text>
      <text x="136" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="9" fill="#ccc" letter-spacing="0.5">FIRST AID</text>
      <text x="136" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="5.5" fill="#888">STERILE WASH</text>
      <text x="136" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="4" fill="#666">FOR SKIN &amp; EYES</text>
      <rect x="100" y="150" width="72" height="1" fill="#333"/>
      <text x="136" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-weight="600" font-size="4" fill="#1a6fc4">Water Life Science®</text>
      <text x="136" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="5.5" fill="#999">7 FL OZ — 207mL</text>
      <text x="136" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="4" fill="#e52535" letter-spacing="0.5">MADE IN U.S.A.</text>
