<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <linearGradient id="bgWM" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0c1520"/><stop offset="100%" stop-color="#111e30"/></linearGradient>
    <filter id="sWM"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="280" height="240" fill="url(#bgWM)" rx="12"/>
  <g filter="url(#sWM)">
    <!-- Wall plate -->
    <rect x="100" y="40" width="80" height="30" rx="4" fill="#555" stroke="#666" stroke-width="0.5"/>
    <!-- Mounting bracket arms -->
    <path d="M110 70 L110 160 Q110 175 125 175 L155 175 Q170 175 170 160 L170 70" fill="none" stroke="#777" stroke-width="4" stroke-linecap="round"/>
    <!-- Bracket base -->
    <rect x="108" y="65" width="64" height="8" rx="2" fill="#666"/>
    <!-- Can sitting in bracket -->
    <rect x="118" y="75" width="44" height="90" rx="5" fill="#e8e8e8"/>
    <ellipse cx="140" cy="75" rx="22" ry="4" fill="#d0d0d0"/>
    <ellipse cx="140" cy="165" rx="22" ry="3.5" fill="#c0c0c0"/>
    <rect x="128" y="60" width="24" height="18" rx="4" fill="#d0d0d0"/>
    <circle cx="140" cy="68" r="4" fill="#999"/>
    <!-- Can label -->
    <rect x="121" y="88" width="38" height="60" rx="2" fill="#fff"/>
    <rect x="121" y="88" width="38" height="14" fill="#e52535" rx="2"/>
    <text x="140" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="6" fill="#fff">EMERGENCY</text>
    <text x="140" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="5" fill="#1a6fc4">PURE DEFENSE</text>
    <text x="140" y="132" text-anchor="middle" font-family="Arial Black,sans-serif" font-weight="900" font-size="7" fill="#e52535">FIRST AID</text>
    <!-- Mounting screws -->
    <circle cx="115" cy="55" r="3" fill="#888" stroke="#666" stroke-width="0.5"/>
    <circle cx="115" cy="55" r="1" fill="#555"/>
    <circle cx="165" cy="55" r="3" fill="#888" stroke="#666" stroke-width="0.5"/>
    <circle cx="165" cy="55" r="1" fill="#555"/>
  </g>
  <!-- Label -->
  <rect x="90" y="192" width="100" height="22" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <text x="140" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-weight="600" font-size="8" fill="#8896a7">TRUCK / WALL MOUNT</text>
</svg>