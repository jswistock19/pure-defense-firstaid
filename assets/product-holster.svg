<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <linearGradient id="bgH" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
    <radialGradient id="atmosH" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0%" stop-color="#e52535" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#1a6fc4" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="holsterBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1d22"/>
      <stop offset="20%" stop-color="#282c33"/>
      <stop offset="50%" stop-color="#333840"/>
      <stop offset="80%" stop-color="#282c33"/>
      <stop offset="100%" stop-color="#1a1d22"/>
    </linearGradient>
    <linearGradient id="holsterInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222630"/>
      <stop offset="100%" stop-color="#14161c"/>
    </linearGradient>
    <linearGradient id="beltLoop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#333840"/>
      <stop offset="100%" stop-color="#1e2128"/>
    </linearGradient>
    <filter id="glowH"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadowH"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/></filter>
    <filter id="bkH"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="280" height="240" fill="url(#bgH)" rx="12"/>
  <rect width="280" height="240" fill="url(#atmosH)" rx="12"/>
  <circle cx="50" cy="52" r="10" fill="#e52535" opacity="0.05" filter="url(#bkH)"/>
  <circle cx="235" cy="42" r="12" fill="#1a6fc4" opacity="0.04" filter="url(#bkH)"/>
  <circle cx="48" cy="180" r="8" fill="#1a6fc4" opacity="0.04" filter="url(#bkH)"/>
  <!-- Floor glow -->
  <ellipse cx="140" cy="212" rx="60" ry="15" fill="#e52535" opacity="0.08" filter="url(#glowH)"/>
  <!-- Holster -->
  <g filter="url(#shadowH)">
    <!-- Belt loop -->
    <rect x="115" y="30" width="50" height="25" rx="3" fill="url(#beltLoop)" stroke="#444" stroke-width="0.5"/>
    <rect x="120" y="35" width="40" height="15" rx="2" fill="url(#holsterInner)"/>
    <!-- Belt loop stitching -->
    <line x1="118" y1="33" x2="118" y2="52" stroke="#555" stroke-width="0.5" stroke-dasharray="2,2"/>
    <line x1="162" y1="33" x2="162" y2="52" stroke="#555" stroke-width="0.5" stroke-dasharray="2,2"/>
    <!-- Main holster body -->
    <path d="M105,55 L175,55 L175,60 Q178,60 178,65 L178,185 Q178,195 168,195 L112,195 Q102,195 102,185 L102,65 Q102,60 105,60Z" fill="url(#holsterBody)" stroke="#444" stroke-width="0.5"/>
    <!-- Stitching -->
    <path d="M108,60 L108,190" stroke="#555" stroke-width="0.4" stroke-dasharray="3,2" fill="none"/>
    <path d="M172,60 L172,190" stroke="#555" stroke-width="0.4" stroke-dasharray="3,2" fill="none"/>
    <!-- Can peek from top -->
    <rect x="115" y="45" width="50" height="35" rx="4" fill="#3d4150"/>
    <rect x="115" y="55" width="50" height="22" fill="#1a1e2e"/>
    <rect x="115" y="55" width="50" height="8" fill="#e52535"/>
    <text x="140" y="62" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="4.5" fill="#fff" letter-spacing="0.5">PURE</text>
    <rect x="115" y="63" width="50" height="7" fill="#1a6fc4"/>
    <text x="140" y="69" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="4" fill="#fff">DEFENSE</text>
    <!-- Retention strap -->
    <rect x="108" y="80" width="64" height="8" rx="2" fill="#333840" stroke="#555" stroke-width="0.3"/>
    <!-- Snap button -->
    <circle cx="140" cy="84" r="3.5" fill="#555" stroke="#666" stroke-width="0.5"/>
    <circle cx="140" cy="84" r="1.5" fill="#333"/>
    <!-- PD brand embossed -->
    <rect x="115" y="100" width="50" height="22" rx="3" fill="rgba(229,37,53,0.08)" stroke="#e52535" stroke-width="0.3" opacity="0.5"/>
    <text x="140" y="114" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="10" fill="#e52535" opacity="0.3">PD</text>
    <!-- Texture lines -->
    <line x1="112" y1="130" x2="168" y2="130" stroke="#3a3d48" stroke-width="0.3"/>
    <line x1="112" y1="140" x2="168" y2="140" stroke="#3a3d48" stroke-width="0.3"/>
    <line x1="112" y1="150" x2="168" y2="150" stroke="#3a3d48" stroke-width="0.3"/>
    <line x1="112" y1="160" x2="168" y2="160" stroke="#3a3d48" stroke-width="0.3"/>
    <line x1="112" y1="170" x2="168" y2="170" stroke="#3a3d48" stroke-width="0.3"/>
    <!-- Bottom drain hole -->
    <circle cx="140" cy="188" r="3" fill="#14161c" stroke="#333" stroke-width="0.3"/>
  </g>
  <circle cx="85" cy="85" r="1" fill="#fff" opacity="0.12"/>
  <circle cx="200" cy="70" r="1" fill="#e52535" opacity="0.2"/>
  <circle cx="75" cy="155" r="0.8" fill="#1a6fc4" opacity="0.15"/>
</svg>