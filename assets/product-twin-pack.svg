<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <linearGradient id="bgTP" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
    <radialGradient id="atmosTP" cx="0.5" cy="0.65" r="0.6">
      <stop offset="0%" stop-color="#1a6fc4" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#e52535" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="canTP" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2d35"/>
      <stop offset="15%" stop-color="#3d4150"/>
      <stop offset="40%" stop-color="#52576a"/>
      <stop offset="55%" stop-color="#6b7089"/>
      <stop offset="70%" stop-color="#52576a"/>
      <stop offset="100%" stop-color="#2a2d35"/>
    </linearGradient>
    <linearGradient id="lblTP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1e2e"/>
      <stop offset="100%" stop-color="#0f1220"/>
    </linearGradient>
    <linearGradient id="redTP" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c41d2d"/>
      <stop offset="50%" stop-color="#e52535"/>
      <stop offset="100%" stop-color="#c41d2d"/>
    </linearGradient>
    <linearGradient id="blueTP" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1456a0"/>
      <stop offset="50%" stop-color="#1a6fc4"/>
      <stop offset="100%" stop-color="#1456a0"/>
    </linearGradient>
    <linearGradient id="trigTP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
    <filter id="glowTP"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadowTP"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/></filter>
    <filter id="bkTP"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="lcTP1"><rect x="68" y="48" width="55" height="118" rx="2"/></clipPath>
    <clipPath id="lcTP2"><rect x="155" y="48" width="55" height="118" rx="2"/></clipPath>
  </defs>
  <rect width="280" height="240" fill="url(#bgTP)" rx="12"/>
  <rect width="280" height="240" fill="url(#atmosTP)" rx="12"/>
  <circle cx="30" cy="55" r="10" fill="#1a6fc4" opacity="0.05" filter="url(#bkTP)"/>
  <circle cx="255" cy="40" r="12" fill="#e52535" opacity="0.04" filter="url(#bkTP)"/>
  <!-- Floor glow -->
  <ellipse cx="140" cy="212" rx="100" ry="20" fill="#1a6fc4" opacity="0.1" filter="url(#glowTP)"/>
  <!-- Left can -->
  <g filter="url(#shadowTP)">
    <rect x="68" y="28" width="55" height="170" rx="5" fill="url(#canTP)"/>
    <ellipse cx="95" cy="28" rx="27" ry="5" fill="#4a4e5e"/>
    <ellipse cx="95" cy="28" rx="25" ry="4" fill="#3d4150"/>
    <ellipse cx="95" cy="198" rx="27" ry="4" fill="#2a2d35"/>
    <!-- Trigger -->
    <rect x="85" y="12" width="20" height="18" rx="3" fill="#444"/>
    <path d="M105,20 L122,20 L122,15 L130,20 L122,25 L122,20" fill="url(#trigTP)" stroke="#555" stroke-width="0.4"/>
    <path d="M105,24 Q115,24 122,28 L122,31 Q115,27 105,27Z" fill="#3a3a3a"/>
    <!-- Label -->
    <g clip-path="url(#lcTP1)">
      <rect x="68" y="48" width="55" height="118" fill="url(#lblTP)"/>
      <rect x="68" y="48" width="55" height="18" fill="url(#redTP)"/>
      <text x="95" y="61" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="8" fill="#fff" letter-spacing="0.8">PURE</text>
      <rect x="68" y="66" width="55" height="14" fill="url(#blueTP)"/>
      <text x="95" y="77" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="7" fill="#fff" letter-spacing="0.4">DEFENSE</text>
      <path d="M92,86 L95,84 L98,86 L98,91 L95,93 L92,91Z" fill="none" stroke="#e52535" stroke-width="0.5" opacity="0.7"/>
      <text x="95" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="2.5" fill="#e52535">+</text>
      <text x="95" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="6" fill="#ccc">FIRST AID</text>
      <text x="95" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="4" fill="#888">STERILE WASH</text>
      <text x="95" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="4" fill="#999">7 FL OZ</text>
    </g>
    <rect x="68" y="48" width="55" height="118" rx="2" fill="none" stroke="#1a6fc4" stroke-width="0.25" opacity="0.25"/>
    <rect x="70" y="28" width="8" height="170" rx="5" fill="rgba(255,255,255,0.05)"/>
  </g>
  <!-- Right can -->
  <g filter="url(#shadowTP)">
    <rect x="155" y="28" width="55" height="170" rx="5" fill="url(#canTP)"/>
    <ellipse cx="182" cy="28" rx="27" ry="5" fill="#4a4e5e"/>
    <ellipse cx="182" cy="28" rx="25" ry="4" fill="#3d4150"/>
    <ellipse cx="182" cy="198" rx="27" ry="4" fill="#2a2d35"/>
    <rect x="172" y="12" width="20" height="18" rx="3" fill="#444"/>
    <path d="M192,20 L209,20 L209,15 L217,20 L209,25 L209,20" fill="url(#trigTP)" stroke="#555" stroke-width="0.4"/>
    <path d="M192,24 Q202,24 209,28 L209,31 Q202,27 192,27Z" fill="#3a3a3a"/>
    <g clip-path="url(#lcTP2)">
      <rect x="155" y="48" width="55" height="118" fill="url(#lblTP)"/>
      <rect x="155" y="48" width="55" height="18" fill="url(#redTP)"/>
      <text x="182" y="61" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="8" fill="#fff" letter-spacing="0.8">PURE</text>
      <rect x="155" y="66" width="55" height="14" fill="url(#blueTP)"/>
      <text x="182" y="77" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="7" fill="#fff" letter-spacing="0.4">DEFENSE</text>
      <path d="M179,86 L182,84 L185,86 L185,91 L182,93 L179,91Z" fill="none" stroke="#e52535" stroke-width="0.5" opacity="0.7"/>
      <text x="182" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="2.5" fill="#e52535">+</text>
      <text x="182" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="6" fill="#ccc">FIRST AID</text>
      <text x="182" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="4" fill="#888">STERILE WASH</text>
      <text x="182" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="4" fill="#999">7 FL OZ</text>
    </g>
    <rect x="155" y="48" width="55" height="118" rx="2" fill="none" stroke="#1a6fc4" stroke-width="0.25" opacity="0.25"/>
    <rect x="157" y="28" width="8" height="170" rx="5" fill="rgba(255,255,255,0.05)"/>
  </g>
  <!-- "x2" badge between cans -->
  <circle cx="140" cy="120" r="14" fill="rgba(229,37,53,0.15)" stroke="#e52535" stroke-width="0.8"/>
  <text x="140" y="124" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="10" fill="#e52535">×2</text>
  <circle cx="55" cy="85" r="1" fill="#fff" opacity="0.12"/>
  <circle cx="230" cy="75" r="1.2" fill="#1a6fc4" opacity="0.18"/>
</svg>