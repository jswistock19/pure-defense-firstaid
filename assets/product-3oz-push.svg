  <rect width="280" height="240" fill="url(#bg3p)" rx="12"/>
  <rect width="280" height="240" fill="url(#atmos3p)" rx="12"/>
  <circle cx="55" cy="55" r="10" fill="#e52535" opacity="0.05" filter="url(#bk3p)"/>
