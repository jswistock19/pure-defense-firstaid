<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0c1520"/><stop offset="100%" stop-color="#111e30"/></linearGradient>
    <linearGradient id="boxC" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3a3a3a"/><stop offset="50%" stop-color="#2a2a2a"/><stop offset="100%" stop-color="#1e1e1e"/></linearGradient>
    <linearGradient id="glowC" x1="0.5" y1="0" x2="0.5" y2="1"><stop offset="0%" stop-color="#1a6fc4" stop-opacity="0.2"/><stop offset="100%" stop-color="#1a6fc4" stop-opacity="0"/></linearGradient>
    <filter id="sC"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/></filter>
    <filter id="gC"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="280" height="240" fill="url(#bgC)" rx="12"/>
  <ellipse cx="140" cy="200" rx="90" ry="18" fill="url(#glowC)" filter="url(#gC)"/>
  <!-- Box -->
  <g filter="url(#sC)">
    <!-- Box front face -->
    <path d="M50 90 L140 75 L230 90 L230 190 L140 205 L50 190Z" fill="url(#boxC)" stroke="#444" stroke-width="0.5"/>
    <!-- Box top face -->
    <path d="M50 90 L100 70 L230 85 L230 90 L140 75 L50 90Z" fill="#3e3e3e"/>
    <!-- Left side -->
    <path d="M50 90 L50 190 L55 192 L55 92Z" fill="#222"/>
    <!-- Label on front -->
    <rect x="88" y="105" width="104" height="65" rx="4" fill="#fff" opacity="0.95"/>
    <rect x="88" y="105" width="104" height="20" rx="4" fill="#e52535"/>
    <text x="140" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="11" fill="#fff">PURE DEFENSE</text>
    <text x="140" y="143" text-anchor="middle" font-family="Arial Black,sans-serif" font-weight="900" font-size="13" fill="#e52535">FIRST AID</text>
    <text x="140" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#666">BULK CASE</text>
    <!-- Handle -->
    <path d="M115 75 Q140 60 165 75" fill="none" stroke="#555" stroke-width="3" stroke-linecap="round"/>
    <!-- Stacked cans icon on box -->
    <g opacity="0.4">
      <rect x="70" y="140" width="8" height="30" rx="2" fill="#ccc"/>
      <rect x="80" y="138" width="8" height="32" rx="2" fill="#ddd"/>
      <rect x="195" y="138" width="8" height="32" rx="2" fill="#ddd"/>
      <rect x="205" y="140" width="8" height="30" rx="2" fill="#ccc"/>
    </g>
  </g>
  <!-- Qty indicators -->
  <g opacity="0.6">
    <rect x="55" y="50" width="8" height="28" rx="3" fill="#999" opacity="0.3"/>
    <rect x="67" y="46" width="8" height="32" rx="3" fill="#aaa" opacity="0.3"/>
    <rect x="205" y="46" width="8" height="32" rx="3" fill="#aaa" opacity="0.3"/>
    <rect x="217" y="50" width="8" height="28" rx="3" fill="#999" opacity="0.3"/>
  </g>
</svg>