<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" width="420" height="520">
  <defs>
    <linearGradient id="heroCanBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2d35"/>
      <stop offset="10%" stop-color="#3d4150"/>
      <stop offset="35%" stop-color="#52576a"/>
      <stop offset="50%" stop-color="#6b7089"/>
      <stop offset="65%" stop-color="#52576a"/>
      <stop offset="90%" stop-color="#3d4150"/>
      <stop offset="100%" stop-color="#2a2d35"/>
    </linearGradient>
    <linearGradient id="heroLabel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1e2e"/>
      <stop offset="100%" stop-color="#0f1220"/>
    </linearGradient>
    <linearGradient id="heroRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c41d2d"/>
      <stop offset="50%" stop-color="#e52535"/>
      <stop offset="100%" stop-color="#c41d2d"/>
    </linearGradient>
    <linearGradient id="heroBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1456a0"/>
      <stop offset="50%" stop-color="#1a6fc4"/>
      <stop offset="100%" stop-color="#1456a0"/>
    </linearGradient>
    <linearGradient id="heroNozzle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#666"/>
      <stop offset="100%" stop-color="#333"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="0.5" cy="0.85" r="0.5">
      <stop offset="0%" stop-color="#e52535" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#1a6fc4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="heroShadow"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/></filter>
    <filter id="heroBloom"><feGaussianBlur stdDeviation="20" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="heroBokeh"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="heroClip"><rect x="140" y="95" width="140" height="310" rx="4"/></clipPath>
  </defs>
  <!-- Atmosphere -->
  <rect width="420" height="520" fill="transparent"/>
  <!-- Bokeh particles -->
  <circle cx="60" cy="80" r="18" fill="#e52535" opacity="0.04" filter="url(#heroBokeh)"/>
  <circle cx="370" cy="60" r="22" fill="#1a6fc4" opacity="0.03" filter="url(#heroBokeh)"/>
  <circle cx="50" cy="380" r="15" fill="#1a6fc4" opacity="0.04" filter="url(#heroBokeh)"/>
  <circle cx="380" cy="350" r="20" fill="#e52535" opacity="0.03" filter="url(#heroBokeh)"/>
  <circle cx="100" cy="220" r="10" fill="#fff" opacity="0.02" filter="url(#heroBokeh)"/>
  <circle cx="340" cy="200" r="12" fill="#fff" opacity="0.02" filter="url(#heroBokeh)"/>
  <!-- Floor glow -->
  <ellipse cx="210" cy="470" rx="140" ry="40" fill="#e52535" opacity="0.12" filter="url(#heroBloom)"/>
  <ellipse cx="210" cy="475" rx="80" ry="18" fill="#1a6fc4" opacity="0.08"/>
  <!-- Can -->
  <g filter="url(#heroShadow)">
    <!-- Can body -->
    <rect x="140" y="55" width="140" height="380" rx="10" fill="url(#heroCanBody)"/>
    <!-- Top cap -->
    <ellipse cx="210" cy="55" rx="70" ry="12" fill="#4a4e5e"/>
    <ellipse cx="210" cy="55" rx="66" ry="10" fill="#3d4150"/>
    <!-- Bottom -->
    <ellipse cx="210" cy="435" rx="70" ry="10" fill="#2a2d35"/>
    <!-- Nozzle assembly -->
    <rect x="190" y="22" width="40" height="38" rx="6" fill="url(#heroNozzle)"/>
    <rect x="196" y="10" width="28" height="18" rx="4" fill="#777"/>
    <ellipse cx="210" cy="10" rx="12" ry="4" fill="#888"/>
    <circle cx="210" cy="22" r="6" fill="#555"/>
    <circle cx="210" cy="22" r="3" fill="#444"/>
    <!-- Label area -->
    <g clip-path="url(#heroClip)">
      <rect x="140" y="95" width="140" height="310" fill="url(#heroLabel)"/>
      <!-- Red top banner -->
      <rect x="140" y="95" width="140" height="52" fill="url(#heroRed)"/>
      <text x="210" y="115" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="10" fill="rgba(255,255,255,0.7)" letter-spacing="2">EMERGENCY</text>
      <text x="210" y="138" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="20" fill="#fff" letter-spacing="2">PURE</text>
      <!-- Blue band -->
      <rect x="140" y="147" width="140" height="38" fill="url(#heroBlue)"/>
      <text x="210" y="172" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="18" fill="#fff" letter-spacing="1.5">DEFENSE</text>
      <!-- Bio-Logic Aqua circle -->
      <circle cx="210" cy="210" r="20" fill="none" stroke="#1a6fc4" stroke-width="1" opacity="0.6"/>
      <text x="210" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="5" fill="#1a6fc4" opacity="0.8">Bio-Logic</text>
      <text x="210" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="5" fill="#1a6fc4" opacity="0.8">Aqua®</text>
      <!-- Divider -->
      <line x1="165" y1="238" x2="255" y2="238" stroke="#e52535" stroke-width="0.8" opacity="0.5"/>
      <!-- FIRST AID -->
      <text x="210" y="268" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="22" fill="#e52535" letter-spacing="1">FIRST AID</text>
      <!-- Sub info -->
      <text x="210" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-weight="600" font-size="8" fill="#aaa" letter-spacing="0.5">FOR SKIN AND EYES</text>
      <text x="210" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-weight="600" font-size="8" fill="#aaa">STERILE WASH</text>
      <!-- Divider -->
      <line x1="170" y1="318" x2="250" y2="318" stroke="#333" stroke-width="0.5"/>
      <!-- Water Life Science -->
      <text x="210" y="335" text-anchor="middle" font-family="Arial,sans-serif" font-weight="600" font-size="6" fill="#1a6fc4" opacity="0.8">Water Life Science®</text>
      <!-- Premium badge -->
      <text x="210" y="352" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="6" fill="#ccc" letter-spacing="1">ABSOLUTE</text>
      <text x="210" y="362" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="5.5" fill="#ccc" letter-spacing="0.8">PREMIUM STANDARD®</text>
      <!-- Made in USA -->
      <text x="210" y="378" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="5.5" fill="#e52535" letter-spacing="1">MADE IN U.S.A.</text>
      <!-- Size -->
      <text x="210" y="398" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#888">7 Fl. Oz. — 207mL</text>
    </g>
    <!-- Label border glow -->
    <rect x="140" y="95" width="140" height="310" rx="4" fill="none" stroke="#e52535" stroke-width="0.4" opacity="0.2"/>
    <!-- Can shine -->
    <rect x="144" y="55" width="18" height="380" rx="10" fill="rgba(255,255,255,0.06)"/>
    <rect x="260" y="70" width="6" height="360" fill="rgba(255,255,255,0.03)"/>
  </g>
  <!-- Floating light specs -->
  <circle cx="120" cy="140" r="1.5" fill="#fff" opacity="0.15"/>
  <circle cx="310" cy="120" r="2" fill="#e52535" opacity="0.2"/>
  <circle cx="100" cy="320" r="1.2" fill="#1a6fc4" opacity="0.2"/>
  <circle cx="330" cy="300" r="1.5" fill="#fff" opacity="0.1"/>
  <circle cx="80" cy="230" r="1" fill="#e52535" opacity="0.15"/>
  <circle cx="350" cy="420" r="1.8" fill="#1a6fc4" opacity="0.15"/>
</svg>