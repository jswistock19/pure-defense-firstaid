<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 500" width="200" height="500">
  <defs>
    <linearGradient id="canBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d8d8d8"/>
      <stop offset="25%" stop-color="#f5f5f5"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#c0c0c0"/>
    </linearGradient>
    <linearGradient id="canTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#d0d0d0"/>
    </linearGradient>
    <linearGradient id="labelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>
    <filter id="canShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Can Body -->
  <g filter="url(#canShadow)">
    <!-- Main cylinder -->
    <rect x="30" y="60" width="140" height="380" rx="8" fill="url(#canBody)"/>
    
    <!-- Top rim -->
    <ellipse cx="100" cy="60" rx="70" ry="12" fill="url(#canTop)" stroke="#bbb" stroke-width="0.5"/>
    
    <!-- Bottom rim -->
    <ellipse cx="100" cy="440" rx="70" ry="10" fill="#c8c8c8" stroke="#bbb" stroke-width="0.5"/>
    
    <!-- Nozzle/trigger area -->
    <rect x="80" y="30" width="40" height="35" rx="4" fill="#d0d0d0"/>
    <rect x="88" y="20" width="24" height="18" rx="10" fill="#c0c0c0" stroke="#aaa" stroke-width="0.5"/>
    <circle cx="100" cy="28" r="5" fill="#999"/>
    
    <!-- Label area -->
    <rect x="35" y="90" width="130" height="320" rx="4" fill="url(#labelBg)"/>
    
    <!-- Red top banner -->
    <rect x="35" y="90" width="130" height="50" rx="4" fill="#e52535"/>
    <rect x="35" y="120" width="130" height="20" fill="#e52535"/>
    
    <!-- EMERGENCY text -->
    <text x="100" y="120" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="20" fill="#ffffff" letter-spacing="1">EMERGENCY</text>
    
    <!-- Blue circle seal -->
    <circle cx="100" cy="215" r="32" fill="none" stroke="#1a6fc4" stroke-width="1.5"/>
    <text x="100" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#1a6fc4" letter-spacing="0.5">Bio-Logic</text>
    <text x="100" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#1a6fc4" letter-spacing="0.5">Aqua®</text>
    
    <!-- PURE DEFENSE text -->
    <text x="100" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-style="italic" font-weight="700" font-size="16" fill="#1a6fc4" letter-spacing="0.5">PURE</text>
    <text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-style="italic" font-weight="700" font-size="16" fill="#1a6fc4" letter-spacing="0.5">DEFENSE</text>
    
    <!-- FIRST AID text -->
    <text x="100" y="265" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22" fill="#e52535" letter-spacing="1">FIRST AID</text>
    
    <!-- Subtitle -->
    <text x="100" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#555" letter-spacing="1">FOR SKIN AND EYES</text>
    
    <!-- STERILE WASH -->
    <text x="100" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333" letter-spacing="0.5">STERILE WASH</text>
    
    <!-- Water Life Science -->
    <text x="100" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-style="italic" font-size="8" fill="#1a6fc4">Water Life Science®</text>
    
    <!-- ABSOLUTE PREMIUM STANDARD -->
    <text x="100" y="358" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="7" fill="#e52535" letter-spacing="0.5">ABSOLUTE</text>
    <text x="100" y="370" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="7" fill="#e52535" letter-spacing="0.5">PREMIUM STANDARD®</text>
    
    <!-- MADE IN U.S.A. -->
    <text x="100" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#333" letter-spacing="0.5">MADE IN U.S.A.</text>
    
    <!-- Size label -->
    <text x="100" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">7 Fl. Oz. – 207mL</text>
    
    <!-- Shine highlight -->
    <rect x="45" y="90" width="15" height="320" rx="4" fill="rgba(255,255,255,0.15)"/>
  </g>
</svg>