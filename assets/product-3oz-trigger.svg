<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f1e38"/>
    </linearGradient>
    <linearGradient id="can2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8c8c8"/>
      <stop offset="30%" stop-color="#f0f0f0"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1a6fc4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a6fc4" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow2"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/></filter>
    <filter id="glowF2"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="280" height="240" fill="url(#bg2)" rx="12"/>
  <ellipse cx="140" cy="205" rx="65" ry="14" fill="url(#glow2)" filter="url(#glowF2)"/>
  <g filter="url(#shadow2)">
    <rect x="108" y="38" width="64" height="165" rx="6" fill="url(#can2)"/>
    <ellipse cx="140" cy="38" rx="32" ry="5.5" fill="#d8d8d8"/>
    <ellipse cx="140" cy="203" rx="32" ry="4.5" fill="#c0c0c0"/>
    <!-- Trigger nozzle -->
    <rect x="126" y="20" width="28" height="22" rx="4" fill="#d0d0d0"/>
    <path d="M154 30 L172 26 L170 32 L154 34Z" fill="#bbb" stroke="#aaa" stroke-width="0.5"/>
    <circle cx="140" cy="28" r="4" fill="#999"/>
    <!-- Label -->
    <rect x="111" y="60" width="58" height="125" rx="3" fill="#fff"/>
    <rect x="111" y="60" width="58" height="25" fill="#e52535" rx="3"/>
    <rect x="111" y="78" width="58" height="7" fill="#e52535"/>
    <text x="140" y="77" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="10" fill="#fff" letter-spacing="0.5">EMERGENCY</text>
    <text x="140" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-style="italic" font-size="8" fill="#1a6fc4">PURE DEFENSE</text>
    <text x="140" y="128" text-anchor="middle" font-family="Arial Black,sans-serif" font-weight="900" font-size="12" fill="#e52535">FIRST AID</text>
    <text x="140" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="5.5" fill="#666">STERILE WASH</text>
    <text x="140" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="5.5" fill="#999">3 Fl. Oz.</text>
    <rect x="113" y="60" width="9" height="125" rx="3" fill="rgba(255,255,255,0.12)"/>
  </g>
  <!-- Trigger badge -->
  <rect x="190" y="45" width="60" height="22" rx="11" fill="rgba(26,111,196,0.15)" stroke="#1a6fc4" stroke-width="1"/>
  <text x="220" y="60" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="9" fill="#1a6fc4">TRIGGER</text>
</svg>