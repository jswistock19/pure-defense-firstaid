<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f1e38"/>
    </linearGradient>
    <linearGradient id="can1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8c8c8"/>
      <stop offset="30%" stop-color="#f0f0f0"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#e52535" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e52535" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow1"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/></filter>
    <filter id="glowF1"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="280" height="240" fill="url(#bg1)" rx="12"/>
  <!-- Glow base -->
  <ellipse cx="140" cy="200" rx="60" ry="15" fill="url(#glow1)" filter="url(#glowF1)"/>
  <!-- Can body -->
  <g filter="url(#shadow1)">
    <rect x="112" y="45" width="56" height="150" rx="6" fill="url(#can1)"/>
    <ellipse cx="140" cy="45" rx="28" ry="5" fill="#d8d8d8"/>
    <ellipse cx="140" cy="195" rx="28" ry="4" fill="#c0c0c0"/>
    <!-- Nozzle -->
    <rect x="130" y="30" width="20" height="18" rx="3" fill="#d0d0d0"/>
    <circle cx="140" cy="38" r="4" fill="#999"/>
    <!-- Label -->
    <rect x="115" y="65" width="50" height="110" rx="3" fill="#fff"/>
    <rect x="115" y="65" width="50" height="22" fill="#e52535" rx="3"/>
    <rect x="115" y="80" width="50" height="7" fill="#e52535"/>
    <text x="140" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="9" fill="#fff" letter-spacing="0.5">EMERGENCY</text>
    <text x="140" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-style="italic" font-size="7" fill="#1a6fc4">PURE DEFENSE</text>
    <text x="140" y="125" text-anchor="middle" font-family="Arial Black,sans-serif" font-weight="900" font-size="10" fill="#e52535">FIRST AID</text>
    <text x="140" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="5" fill="#666">STERILE WASH</text>
    <text x="140" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="5" fill="#999">1 Fl. Oz.</text>
    <!-- Shine -->
    <rect x="117" y="65" width="8" height="110" rx="3" fill="rgba(255,255,255,0.12)"/>
  </g>
  <!-- Size badge -->
  <rect x="195" y="50" width="48" height="22" rx="11" fill="rgba(229,37,53,0.15)" stroke="#e52535" stroke-width="1"/>
  <text x="219" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="10" fill="#e52535">1 OZ</text>
</svg>