<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
    <radialGradient id="atmos1" cx="0.5" cy="0.7" r="0.6">
      <stop offset="0%" stop-color="#e52535" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#1a6fc4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="canBody1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2d35"/>
      <stop offset="15%" stop-color="#3d4150"/>
      <stop offset="40%" stop-color="#52576a"/>
      <stop offset="55%" stop-color="#6b7089"/>
      <stop offset="70%" stop-color="#52576a"/>
      <stop offset="100%" stop-color="#2a2d35"/>
    </linearGradient>
    <linearGradient id="labelBg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1e2e"/>
      <stop offset="100%" stop-color="#0f1220"/>
    </linearGradient>
    <linearGradient id="redStripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c41d2d"/>
      <stop offset="50%" stop-color="#e52535"/>
      <stop offset="100%" stop-color="#c41d2d"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1456a0"/>
      <stop offset="50%" stop-color="#1a6fc4"/>
      <stop offset="100%" stop-color="#1456a0"/>
    </linearGradient>
    <linearGradient id="nozzle1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#333"/>
    </linearGradient>
    <filter id="glow1"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softShadow"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/></filter>
    <filter id="bokeh"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="labelClip1"><rect x="115" y="68" width="50" height="105" rx="2"/></clipPath>
  </defs>
  <!-- Background -->
  <rect width="280" height="240" fill="url(#bg1)" rx="12"/>
  <rect width="280" height="240" fill="url(#atmos1)" rx="12"/>
  <!-- Bokeh particles -->
  <circle cx="45" cy="60" r="8" fill="#e52535" opacity="0.06" filter="url(#bokeh)"/>
  <circle cx="230" cy="45" r="12" fill="#1a6fc4" opacity="0.05" filter="url(#bokeh)"/>
  <circle cx="55" cy="180" r="6" fill="#1a6fc4" opacity="0.07" filter="url(#bokeh)"/>
  <circle cx="240" cy="170" r="10" fill="#e52535" opacity="0.04" filter="url(#bokeh)"/>
  <circle cx="70" cy="120" r="4" fill="#fff" opacity="0.04" filter="url(#bokeh)"/>
  <circle cx="215" cy="100" r="5" fill="#fff" opacity="0.03" filter="url(#bokeh)"/>
  <!-- Floor glow -->
  <ellipse cx="140" cy="210" rx="65" ry="18" fill="#e52535" opacity="0.12" filter="url(#glow1)"/>
  <ellipse cx="140" cy="212" rx="40" ry="8" fill="#e52535" opacity="0.08"/>
  <!-- Can -->
  <g filter="url(#softShadow)">
    <!-- Can body -->
    <rect x="112" y="42" width="56" height="155" rx="5" fill="url(#canBody1)"/>
    <!-- Top rim -->
    <ellipse cx="140" cy="42" rx="28" ry="5" fill="#4a4e5e"/>
    <ellipse cx="140" cy="42" rx="26" ry="4" fill="#3d4150"/>
    <!-- Bottom rim -->
    <ellipse cx="140" cy="197" rx="28" ry="4" fill="#2a2d35"/>
    <!-- Nozzle -->
    <rect x="131" y="26" width="18" height="18" rx="3" fill="url(#nozzle1)"/>
    <rect x="134" y="22" width="12" height="8" rx="2" fill="#666"/>
    <circle cx="140" cy="26" r="3" fill="#444"/>
    <!-- Label area -->
    <g clip-path="url(#labelClip1)">
      <rect x="115" y="68" width="50" height="105" fill="url(#labelBg1)"/>
      <!-- Red top stripe -->
      <rect x="115" y="68" width="50" height="20" fill="url(#redStripe)"/>
      <text x="140" y="82" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="8" fill="#fff" letter-spacing="1">PURE</text>
      <!-- Blue mid band -->
      <rect x="115" y="88" width="50" height="14" fill="url(#blueAccent)"/>
      <text x="140" y="98" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="7" fill="#fff" letter-spacing="0.5">DEFENSE</text>
      <!-- Divider line -->
      <line x1="123" y1="107" x2="157" y2="107" stroke="#e52535" stroke-width="0.5" opacity="0.6"/>
      <!-- Shield icon -->
      <path d="M137,112 L140,110 L143,112 L143,117 L140,119 L137,117Z" fill="none" stroke="#e52535" stroke-width="0.6" opacity="0.8"/>
      <text x="140" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="3" fill="#e52535">+</text>
      <!-- Product text -->
      <text x="140" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="6" fill="#ccc" letter-spacing="0.3">FIRST AID</text>
      <text x="140" y="137" text-anchor="middle" font-family="Arial,sans-serif" font-size="4" fill="#888">STERILE WASH</text>
      <!-- Bottom info -->
      <rect x="115" y="148" width="50" height="1" fill="#333"/>
      <text x="140" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="4" fill="#666">FOR SKIN &amp; EYES</text>
      <text x="140" y="166" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="4.5" fill="#999">1 FL OZ</text>
    </g>
    <!-- Label border glow -->
    <rect x="115" y="68" width="50" height="105" rx="2" fill="none" stroke="#e52535" stroke-width="0.3" opacity="0.3"/>
    <!-- Can shine highlight -->
    <rect x="114" y="42" width="10" height="155" rx="5" fill="rgba(255,255,255,0.06)"/>
    <rect x="155" y="50" width="3" height="140" fill="rgba(255,255,255,0.04)"/>
  </g>
  <!-- Floating light specs -->
  <circle cx="90" cy="90" r="1" fill="#fff" opacity="0.15"/>
  <circle cx="195" cy="75" r="1.2" fill="#e52535" opacity="0.2"/>
  <circle cx="80" cy="150" r="0.8" fill="#1a6fc4" opacity="0.2"/>
  <circle cx="200" cy="140" r="1" fill="#fff" opacity="0.1"/>
</svg>