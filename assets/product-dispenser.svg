<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
    <radialGradient id="atmosD" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0%" stop-color="#e52535" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#1a6fc4" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="cabinetFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d0d4dc"/>
      <stop offset="50%" stop-color="#b8bcc5"/>
      <stop offset="100%" stop-color="#a0a4ad"/>
    </linearGradient>
    <linearGradient id="cabinetSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#888c95"/>
      <stop offset="100%" stop-color="#70747d"/>
    </linearGradient>
    <filter id="glowD"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadowD"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/></filter>
    <filter id="bkD"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="280" height="240" fill="url(#bgD)" rx="12"/>
  <rect width="280" height="240" fill="url(#atmosD)" rx="12"/>
  <circle cx="50" cy="50" r="10" fill="#e52535" opacity="0.05" filter="url(#bkD)"/>
  <circle cx="235" cy="45" r="12" fill="#1a6fc4" opacity="0.04" filter="url(#bkD)"/>
  <!-- Floor glow -->
  <ellipse cx="140" cy="210" rx="75" ry="18" fill="#e52535" opacity="0.08" filter="url(#glowD)"/>
  <!-- Dispenser cabinet -->
  <g filter="url(#shadowD)">
    <!-- Main body -->
    <rect x="80" y="35" width="110" height="165" rx="4" fill="url(#cabinetFront)" stroke="#999" stroke-width="0.5"/>
    <!-- Right side depth -->
    <path d="M190,35 L205,25 L205,190 L190,200Z" fill="url(#cabinetSide)" stroke="#888" stroke-width="0.3"/>
    <!-- Top edge -->
    <path d="M80,35 L95,25 L205,25 L190,35Z" fill="#c5c9d2" stroke="#999" stroke-width="0.3"/>
    <!-- Red header banner -->
    <rect x="85" y="42" width="100" height="28" rx="2" fill="#e52535"/>
    <text x="135" y="53" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="7" fill="#fff" letter-spacing="1">PURE DEFENSE</text>
    <text x="135" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="5" fill="rgba(255,255,255,0.85)">EYE WASH STATION</text>
    <!-- Divider -->
    <line x1="90" y1="78" x2="180" y2="78" stroke="#999" stroke-width="0.5"/>
    <!-- Can slots (3 visible) -->
    <rect x="90" y="85" width="28" height="70" rx="3" fill="#555" stroke="#666" stroke-width="0.3"/>
    <rect x="121" y="85" width="28" height="70" rx="3" fill="#555" stroke="#666" stroke-width="0.3"/>
    <rect x="152" y="85" width="28" height="70" rx="3" fill="#555" stroke="#666" stroke-width="0.3"/>
    <!-- Mini cans in slots -->
    <rect x="95" y="95" width="18" height="55" rx="2" fill="#3d4150"/>
    <rect x="95" y="105" width="18" height="20" fill="#1a1e2e"/>
    <rect x="95" y="105" width="18" height="6" fill="#e52535" rx="1"/>
    <rect x="95" y="111" width="18" height="5" fill="#1a6fc4" rx="1"/>
    <rect x="126" y="95" width="18" height="55" rx="2" fill="#3d4150"/>
    <rect x="126" y="105" width="18" height="20" fill="#1a1e2e"/>
    <rect x="126" y="105" width="18" height="6" fill="#e52535" rx="1"/>
    <rect x="126" y="111" width="18" height="5" fill="#1a6fc4" rx="1"/>
    <rect x="157" y="95" width="18" height="55" rx="2" fill="#3d4150"/>
    <rect x="157" y="105" width="18" height="20" fill="#1a1e2e"/>
    <rect x="157" y="105" width="18" height="6" fill="#e52535" rx="1"/>
    <rect x="157" y="111" width="18" height="5" fill="#1a6fc4" rx="1"/>
    <!-- Bottom info plate -->
    <rect x="90" y="165" width="90" height="24" rx="2" fill="rgba(10,14,26,0.6)" stroke="#555" stroke-width="0.3"/>
    <text x="135" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="5" fill="#ccc">MAGAZINE DISPENSER</text>
    <text x="135" y="186" text-anchor="middle" font-family="Arial,sans-serif" font-size="3.5" fill="#999">OSHA COMPLIANT • WALL MOUNT</text>
    <!-- Cabinet edge highlight -->
    <line x1="80" y1="35" x2="80" y2="200" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </g>
  <circle cx="80" cy="80" r="1" fill="#fff" opacity="0.12"/>
  <circle cx="210" cy="65" r="1" fill="#e52535" opacity="0.18"/>
</svg>