<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1425"/><stop offset="100%" stop-color="#0e1a30"/></linearGradient>
    <linearGradient id="metalD" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#888"/><stop offset="30%" stop-color="#ccc"/><stop offset="55%" stop-color="#ddd"/><stop offset="100%" stop-color="#888"/></linearGradient>
    <linearGradient id="glowD" x1="0.5" y1="0" x2="0.5" y2="1"><stop offset="0%" stop-color="#e52535" stop-opacity="0.15"/><stop offset="100%" stop-color="#e52535" stop-opacity="0"/></linearGradient>
    <filter id="sD"><feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/></filter>
    <filter id="gD"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="280" height="240" fill="url(#bgD)" rx="12"/>
  <ellipse cx="140" cy="210" rx="80" ry="14" fill="url(#glowD)" filter="url(#gD)"/>
  <!-- Wall mount plate -->
  <g filter="url(#sD)">
    <rect x="65" y="30" width="150" height="180" rx="6" fill="url(#metalD)" stroke="#777" stroke-width="1"/>
    <!-- Inner panel -->
    <rect x="75" y="40" width="130" height="120" rx="4" fill="#f5f5f5"/>
    <!-- Red cross -->
    <rect x="125" y="55" width="30" height="90" rx="2" fill="#e52535" opacity="0.12"/>
    <rect x="100" y="80" width="80" height="30" rx="2" fill="#e52535" opacity="0.12"/>
    <!-- Can slots -->
    <g opacity="0.6">
      <rect x="85" y="48" width="22" height="50" rx="4" fill="#ddd" stroke="#ccc" stroke-width="0.5"/>
      <rect x="113" y="48" width="22" height="50" rx="4" fill="#ddd" stroke="#ccc" stroke-width="0.5"/>
      <rect x="141" y="48" width="22" height="50" rx="4" fill="#ddd" stroke="#ccc" stroke-width="0.5"/>
      <rect x="169" y="48" width="22" height="50" rx="4" fill="#ddd" stroke="#ccc" stroke-width="0.5"/>
    </g>
    <!-- Can tops in slots -->
    <g>
      <ellipse cx="96" cy="48" rx="10" ry="3" fill="#c0c0c0"/>
      <ellipse cx="124" cy="48" rx="10" ry="3" fill="#c0c0c0"/>
      <ellipse cx="152" cy="48" rx="10" ry="3" fill="#c0c0c0"/>
      <ellipse cx="180" cy="48" rx="10" ry="3" fill="#c0c0c0"/>
    </g>
    <!-- Label area -->
    <rect x="88" y="110" width="104" height="40" rx="3" fill="#fff" stroke="#ddd" stroke-width="0.5"/>
    <text x="140" y="127" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="9" fill="#e52535">PURE DEFENSE</text>
    <text x="140" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="7" fill="#444">EYE WASH STATION</text>
    <!-- Mounting screws -->
    <circle cx="80" cy="175" r="4" fill="#999" stroke="#777" stroke-width="1"/>
    <circle cx="200" cy="175" r="4" fill="#999" stroke="#777" stroke-width="1"/>
    <circle cx="80" cy="175" r="1.5" fill="#666"/>
    <circle cx="200" cy="175" r="1.5" fill="#666"/>
  </g>
  <!-- OSHA badge -->
  <rect x="185" y="8" width="72" height="22" rx="11" fill="rgba(229,37,53,0.2)" stroke="#e52535" stroke-width="1"/>
  <text x="221" y="23" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="8" fill="#e52535">OSHA READY</text>
</svg>