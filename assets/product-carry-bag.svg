<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <linearGradient id="bgCB" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
    <radialGradient id="atmosCB" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0%" stop-color="#2d5a1e" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#e52535" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="bagFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d5a2a"/>
      <stop offset="50%" stop-color="#2d4420"/>
      <stop offset="100%" stop-color="#1e3015"/>
    </linearGradient>
    <linearGradient id="bagFlap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a6d35"/>
      <stop offset="100%" stop-color="#3d5a2a"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d4420"/>
      <stop offset="100%" stop-color="#1e3015"/>
    </linearGradient>
    <filter id="glowCB"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadowCB"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/></filter>
    <filter id="bkCB"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="280" height="240" fill="url(#bgCB)" rx="12"/>
  <rect width="280" height="240" fill="url(#atmosCB)" rx="12"/>
  <circle cx="50" cy="50" r="10" fill="#2d5a1e" opacity="0.06" filter="url(#bkCB)"/>
  <circle cx="238" cy="45" r="12" fill="#e52535" opacity="0.04" filter="url(#bkCB)"/>
  <circle cx="45" cy="180" r="8" fill="#e52535" opacity="0.04" filter="url(#bkCB)"/>
  <!-- Floor glow -->
  <ellipse cx="140" cy="212" rx="75" ry="16" fill="#2d5a1e" opacity="0.1" filter="url(#glowCB)"/>
  <!-- Carry bag -->
  <g filter="url(#shadowCB)">
    <!-- Main bag body -->
    <rect x="75" y="55" width="130" height="145" rx="6" fill="url(#bagFront)" stroke="#4a6d35" stroke-width="0.5"/>
    <!-- Top flap -->
    <path d="M75,55 L75,45 Q75,38 82,38 L198,38 Q205,38 205,45 L205,55Z" fill="url(#bagFlap)" stroke="#4a6d35" stroke-width="0.5"/>
    <!-- MOLLE straps (horizontal) -->
    <rect x="82" y="68" width="116" height="5" rx="1" fill="url(#strapGrad)" stroke="#3d5a2a" stroke-width="0.3"/>
    <rect x="82" y="78" width="116" height="5" rx="1" fill="url(#strapGrad)" stroke="#3d5a2a" stroke-width="0.3"/>
    <rect x="82" y="88" width="116" height="5" rx="1" fill="url(#strapGrad)" stroke="#3d5a2a" stroke-width="0.3"/>
    <!-- MOLLE slots -->
    <rect x="95" y="69" width="12" height="3" rx="0.5" fill="#1e3015"/>
    <rect x="115" y="69" width="12" height="3" rx="0.5" fill="#1e3015"/>
    <rect x="135" y="69" width="12" height="3" rx="0.5" fill="#1e3015"/>
    <rect x="155" y="69" width="12" height="3" rx="0.5" fill="#1e3015"/>
    <rect x="175" y="69" width="12" height="3" rx="0.5" fill="#1e3015"/>
    <rect x="105" y="79" width="12" height="3" rx="0.5" fill="#1e3015"/>
    <rect x="125" y="79" width="12" height="3" rx="0.5" fill="#1e3015"/>
    <rect x="145" y="79" width="12" height="3" rx="0.5" fill="#1e3015"/>
    <rect x="165" y="79" width="12" height="3" rx="0.5" fill="#1e3015"/>
    <rect x="95" y="89" width="12" height="3" rx="0.5" fill="#1e3015"/>
    <rect x="115" y="89" width="12" height="3" rx="0.5" fill="#1e3015"/>
    <rect x="135" y="89" width="12" height="3" rx="0.5" fill="#1e3015"/>
    <rect x="155" y="89" width="12" height="3" rx="0.5" fill="#1e3015"/>
    <rect x="175" y="89" width="12" height="3" rx="0.5" fill="#1e3015"/>
    <!-- Front pocket -->
    <rect x="90" y="102" width="100" height="60" rx="4" fill="rgba(30,48,21,0.8)" stroke="#3d5a2a" stroke-width="0.5"/>
    <!-- Red cross patch -->
    <rect x="120" y="112" width="40" height="40" rx="3" fill="#e52535"/>
    <rect x="133" y="116" width="14" height="32" rx="1" fill="#fff"/>
    <rect x="124" y="125" width="32" height="14" rx="1" fill="#fff"/>
    <!-- Cross inner -->
    <rect x="135" y="118" width="10" height="28" rx="1" fill="#e52535"/>
    <rect x="126" y="127" width="28" height="10" rx="1" fill="#e52535"/>
    <!-- Brand text below cross -->
    <text x="140" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="4" fill="#ccc" letter-spacing="0.5">PURE DEFENSE</text>
    <!-- Bottom info -->
    <rect x="85" y="172" width="110" height="18" rx="2" fill="rgba(10,14,26,0.4)" stroke="#3d5a2a" stroke-width="0.3"/>
    <text x="140" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="5" fill="#ccc">TACTICAL CARRY BAG</text>
    <text x="140" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="3.5" fill="#888">FIELD MEDIC • MOLLE COMPATIBLE</text>
    <!-- Handle -->
    <path d="M120,38 Q120,28 130,28 L150,28 Q160,28 160,38" fill="none" stroke="#4a6d35" stroke-width="3" stroke-linecap="round"/>
    <!-- Buckle clips -->
    <rect x="110" y="96" width="8" height="8" rx="1" fill="#666" stroke="#888" stroke-width="0.3"/>
    <rect x="162" y="96" width="8" height="8" rx="1" fill="#666" stroke="#888" stroke-width="0.3"/>
  </g>
  <circle cx="80" cy="82" r="1" fill="#fff" opacity="0.1"/>
  <circle cx="210" cy="65" r="1" fill="#2d5a1e" opacity="0.2"/>
  <circle cx="70" cy="160" r="0.8" fill="#e52535" opacity="0.15"/>
</svg>